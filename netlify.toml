[build]
  base    = "frontend-user"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "frontend-user/dist"

[build.environment]
  VITE_API_URL = "https://api.dander.io"

[[redirects]]
  from   = "/o/:id"
  to     = "https://api.dander.io/api/v1/offers/:id/og"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
