[build]
  base    = "frontend-user"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "frontend-user/dist"

[build.environment]
  VITE_API_URL = "https://api.tapprove.io"

[[redirects]]
  from   = "/o/:id"
  to     = "https://api.tapprove.io/api/v1/offers/:id/og"
  status = 200
  force  = true

# NFC tap fallback — Android App Links normally route /tap into the
# installed customer app, but a no-app phone follows the link to this
# SPA host instead. The SPA has no /tap route, so without this proxy
# the catch-all below redirects to /. Proxy to the backend's join page
# which renders a personalised "Get TapProve at <business>" landing
# with the business name, today's offer count, and Play Store CTA.
[[redirects]]
  from   = "/tap"
  to     = "https://api.tapprove.io/api/public/tap"
  status = 200
  force  = true

# Till sticker fallback — till taps always come from logged-in
# customers with the app installed, so a no-app /till means someone
# scanned the sticker before installing. Proxy to the generic install
# page (join with no business param renders default TapProve copy).
[[redirects]]
  from   = "/till"
  to     = "https://api.tapprove.io/api/public/join"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
