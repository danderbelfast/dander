[build]
  base    = "frontend-user"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "frontend-user/dist"

[build.environment]
  VITE_API_URL = "https://api.tapprove.io"

[[redirects]]
  from   = "/o/:id"
  to     = "https://api.tapprove.io/api/v1/offers/:id/og"
  status = 200
  force  = true

# /tap is served by the SPA (react-router) — see frontend-user/src/pages/Tap.jsx

# Till sticker fallback — till taps always come from logged-in
# customers with the app installed, so a no-app /till means someone
# scanned the sticker before installing. Proxy to the generic install
# page (join with no business param renders default TapProve copy).
[[redirects]]
  from   = "/till"
  to     = "https://api.tapprove.io/api/public/join"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
